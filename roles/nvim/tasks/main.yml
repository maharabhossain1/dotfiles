---
- name: Create ~/.config directory
  file:
    path: "{{ ansible_facts["env"]["HOME"] }}/.config"
    state: directory
    mode: '0755'

- name: Symlink nvim config
  file:
    src: "{{ dotfiles_dir }}/roles/nvim/files/nvim"
    dest: "{{ ansible_facts["env"]["HOME"] }}/.config/nvim"
    state: link
    force: yes
