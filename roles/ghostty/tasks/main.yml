---
- name: Create ghostty config directory
  file:
    path: "{{ ansible_env.HOME }}/.config/ghostty"
    state: directory
    mode: '0755'

- name: Symlink ghostty config
  file:
    src: "{{ dotfiles_dir }}/roles/ghostty/files/config"
    dest: "{{ ansible_env.HOME }}/.config/ghostty/config"
    state: link
    force: yes
