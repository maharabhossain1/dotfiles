# ---- PREFIX ----
set -g prefix C-b
bind C-b send-prefix

# ---- GENERAL ----
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -g mouse on
set -g history-limit 50000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -sg escape-time 10
set -g focus-events on
set -g status-interval 5

# ---- KEY BINDINGS ----
bind r source-file ~/.tmux.conf \; display "Config reloaded!"

# Splits (inherit current path)
unbind '"'
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# New window with current path
bind c new-window -c "#{pane_current_path}"

# Pane navigation (vim keys, no prefix needed with vim-tmux-navigator)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resize panes (repeatable with -r)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ---- COPY MODE (vim) ----
setw -g mode-keys vi
bind Enter copy-mode
bind -T copy-mode-vi v   send-keys -X begin-selection
bind -T copy-mode-vi y   send-keys -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"

# ---- STATUS BAR (Catppuccin Mocha) ----
set -g status on
set -g status-position bottom
set -g status-justify  left

# Colors
set -g status-style                  "bg=#1e1e2e"
set -g message-style                 "fg=#cdd6f4,bg=#313244"
set -g message-command-style         "fg=#cdd6f4,bg=#313244"
set -g pane-border-style             "fg=#313244"
set -g pane-active-border-style      "fg=#89b4fa"

# Left: session name
set -g status-left-length  40
set -g status-left  "#[fg=#1e1e2e,bg=#89b4fa,bold] #S #[fg=#89b4fa,bg=#1e1e2e]"

# Right: time + host
set -g status-right-length 80
set -g status-right "#[fg=#313244,bg=#1e1e2e]#[fg=#cdd6f4,bg=#313244]  %H:%M  %d %b #[fg=#89b4fa,bg=#313244]#[fg=#1e1e2e,bg=#89b4fa,bold] #h "

# Windows
setw -g window-status-separator     ""
setw -g window-status-format        "#[fg=#6c7086,bg=#1e1e2e]  #I #W  "
setw -g window-status-current-format "#[fg=#1e1e2e,bg=#89b4fa,bold]  #I #W  "

# ---- PLUGINS ----
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'christoomey/vim-tmux-navigator'

# Initialize TPM (must be last line)
run '~/.tmux/plugins/tpm/tpm'
